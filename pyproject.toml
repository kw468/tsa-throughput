[project]
name = "tsa-throughput"
version = "0.1.0"
description = "Clean and combine TSA FOIA checkpoint throughput releases"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.1",
    "fastexcel>=0.21.0",
    "pdfplumber>=0.11.10",
    "polars>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pyrefly>=1.5.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "rust-just>=1.59.0",
]

[project.scripts]
tsa-throughput = "tsa_throughput.cli:main"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PTH", "C4"]
ignore = ["PLR2004", "PLR0913", "PLR0915", "PLR0912"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]
"src/tsa_throughput/cli.py" = ["PLR0917"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.pyrefly]
project-includes = ["src", "tests"]
python-interpreter-path = ".venv/bin/python"
search-path = ["src", "."]
